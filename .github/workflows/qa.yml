name: QA

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Local Supabase stack inside the runner — these are the CLI's
      # well-known demo keys, not secrets (same values as .env.local).
      SUPABASE_URL: http://127.0.0.1:55321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      APP_URL: http://localhost:3199
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase stack
        run: supabase start

      - name: Run QA gate
        run: bash scripts/qa.sh

      # Live model eval runs only when the repo secret is configured —
      # add ANTHROPIC_API_KEY in GitHub → Settings → Secrets to enable.
      - name: Live model eval
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npx tsx eval/run.ts
          else
            echo "ANTHROPIC_API_KEY secret not set — skipping live eval."
          fi

      - name: Server log on failure
        if: failure()
        run: cat /tmp/boundright-qa-server.log || true
